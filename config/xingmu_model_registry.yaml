schema_version: "1.0"
generated_at: "2026-06-03"
source_root: "/root/autodl-fs/xingmu_model"
source_catalog: "/root/autodl-fs/xingmu_model/platform/inference_service/capability_catalog.py"
source_service: "/root/autodl-fs/xingmu_model/platform/inference_service/app.py"
integration_policy:
  allowed_scope: "frontend_displayed_acceptance_scenarios_only"
  displayed_capabilities: 32
  hidden_capabilities_excluded: 8
  default_routable: true
  mutation_policy: "do_not_move_delete_or_rename_xingmu_model_assets"
  annotation_platform_strategy: "HYBRID_TEACHER_QUALITY"
  annotation_platform_priority: "quality_first"
  notes:
    - "This manifest is an Annotation-Platform sidecar registry. It does not relocate or rewrite xingmu_model assets."
    - "Only the 32 frontend-displayed, direct-testable scenarios are eligible for default routing."
    - "The 8 hidden scenarios are recorded for exclusion and must not be selected by default model routing."

service_binding:
  base_url: "http://127.0.0.1:9000"
  health_endpoint: "/healthz"
  frontend_public_route: "Model Registry -> xingmu_model"
  algorithm_adapter: "/root/autodl-fs/Annotation-Platform/algorithm-service/adapters/xingmu_adapter.py"
  backend_seed_source: "/root/autodl-fs/Annotation-Platform/backend-springboot/src/main/java/com/annotation/platform/service/AutoLabelToModelService.java"

