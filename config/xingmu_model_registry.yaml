    aliases: ["通用文字OCR识别", "近景车牌号码识别", "文字", "车牌"]
    endpoint: "multiple:/api/model-demo/ocr,/api/model-demo/plate-recognize"
    status: "available"
    version: "v0.5.6_public_ocr_repair"
    notes: "OCR 和车牌识别统一登记为文本识别资产；平台侧仍按具体 endpoint 路由。"

