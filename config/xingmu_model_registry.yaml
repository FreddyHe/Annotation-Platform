    classes: ["person", "vehicle", "boat", "engineering_vehicle", "excavator", "dump_truck"]
    aliases: ["人形", "车辆", "船只", "工程车辆", "挖掘机", "渣土车", "无人机俯视"]
    endpoint: "/api/model-demo/predict"
    status: "available"
    version: "v0.5.6_public_ocr_repair"
    notes: "共享 xingmu predict 入口；已作为默认可路由专用模型组接入。"

