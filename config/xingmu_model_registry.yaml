    endpoint: "multiple:/api/model-demo/*"
    status: "available"
    version: "v0.5.6_public_ocr_repair"
    notes: "每个场景有独立 endpoint；候选运行时按 scenario_inventory 的 endpoint 分发。"

  - group_id: "M9"
    group_ref: "event_sample"
    group_name: "事件样例回放组"
    task_type: "event_sample"
    domain_tags: ["通用场景", "交通场景"]
    classes: ["event_sample"]
    aliases: ["人群聚集", "交通拥堵", "事件回放"]
    endpoint: "/api/model-demo/event-video-replay"
    status: "available"
    version: "v0.5.6_public_ocr_repair"
    notes: "事件型能力当前作为样例/回放入口接入，不伪造逐框检测结果。"

  - group_id: "M10"
    group_ref: "ocr_endpoint"
    group_name: "OCR 与文本识别组"
